name: Create Reels Video

on:
  push:
    branches:
      - feature/ai-video-editor
    paths:
      - ".github/workflows/create-reels.yml"
      - "video_editor/stock_media.py"
      - "tests/test_stock_media.py"
      - "media/input/**"
  workflow_dispatch:
    inputs:
      script:
        description: "Naskah narasi. Pisahkan setiap scene dengan titik."
        required: true
        type: string
      output_name:
        description: "Nama file MP4 hasil video"
        required: true
        default: "reels.mp4"
        type: string
      voice:
        description: "Suara narator"
        required: true
        default: "id-ID-ArdiNeural"
        type: choice
        options:
          - id-ID-ArdiNeural
          - id-ID-GadisNeural

permissions:
  contents: read

jobs:
  render-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: feature/ai-video-editor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts openai-whisper

      - name: Prepare narration
        env:
          SCRIPT: ${{ inputs.script || 'Pernah dengar ada ayah yang rela tidak makan selama berbulan-bulan demi anaknya? Inilah penguin kaisar. Setelah betina bertelur, ia pergi ke laut mencari makanan. Sang jantan menjaga telur di atas kedua kakinya dan menutupinya dengan lipatan kulit agar tetap hangat. Selama sekitar dua bulan, ia bertahan di tengah dinginnya Antarktika tanpa makan. Para penguin jantan juga berkumpul rapat untuk saling menghangatkan tubuh. Sungguh luar biasa perjuangan ayah penguin kaisar.' }}
        run: |
          mkdir -p work output
          printf '%s\n' "$SCRIPT" > work/script.txt

      - name: Inspect user-provided footage
        run: |
          if ! find media/input -type f \\( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.avi' -o -iname '*.m4v' \\) -print -quit | grep -q .; then
            echo "Belum ada video. Upload minimal satu file video ke folder media/input lalu jalankan ulang workflow."
            exit 1
          fi
          python -m video_editor.media_inspector media/input --output-dir work/media --segment-duration 4
          python - <<'PY'
          import json, re
          from pathlib import Path
          catalog_path = Path("work/media/media_catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          script = Path("work/script.txt").read_text(encoding="utf-8").lower()
          script_terms = set(re.findall(r"[a-z0-9]+", script))
          for asset in catalog["assets"]:
              filename_terms = set(re.findall(r"[a-z0-9]+", Path(asset["path"]).stem.lower()))
              asset["tags"] = sorted(filename_terms | script_terms)
              asset["description"] = "Footage provided by user: " + Path(asset["path"]).name
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Prepared {len(catalog['assets'])} footage segments.")
          PY

      - name: Generate voice, subtitles and render MP4
        run: |
          python -m video_editor.pipeline work/script.txt work/media/media_catalog.json \
            --voice "${{ inputs.voice || 'id-ID-ArdiNeural' }}" \
            --output-video "output/${{ inputs.output_name }}" \
            --work-dir work/project \
            --whisper-model base

      - name: Save video and project files
        uses: actions/upload-artifact@v4
        with:
          name: reels-video
          path: |
            output/*.mp4
            work/project/storyboard.json
            work/project/voiceover.mp3
            work/project/subtitles/*.srt
            work/media/media_catalog.json
          if-no-files-found: error
          retention-days: 7
